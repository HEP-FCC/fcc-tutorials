name: Publish

on:
  push:
    branches:
    - main
  workflow_dispatch:

# Allow the job to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Run only one deployment at a time, but let an in-progress one finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - id: pages
      uses: actions/configure-pages@v5
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install Requirements
      run: |
        pip3 install -r requirements.txt
    - name: Jupyter Book build
      env:
        # Path the site is served from, e.g. /fcc-tutorials
        BASE_URL: ${{ steps.pages.outputs.base_path }}
      run: |
        jupyter book build --html
    - uses: actions/upload-pages-artifact@v4
      with:
        path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
